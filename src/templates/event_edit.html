<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Event</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='WealthWatchersStyle.css') }}">
</head>
<body>
    <div class="container">
        <h1>Edit Event</h1>
        <form method="POST">
            <label for="amount">Amount (positive for savings, negative for expense):</label>
            <input type="number" name="amount" step="0.01" value="{{ event.amount }}" required>

            <label for="description">Description:</label>
            <input type="text" name="description" value="{{ event.description }}" required>

            <label for="date">Date:</label>
            <input type="date" name="date" value="{{ event.date }}" required>

            <label for="category">Category:</label>
            <select name="category_id" required>
                {% for category in categories %}
                    <option value="{{ category.category_id }}"
                        { % if event.category_id == category.category_id %}selected{% endif %}>
                            {{ category.category_name }}
                    </option>
                {% endfor %}
            </select>

            <label for="account">Account:</label>
            <select name="account_id" required>
                {% for account in accounts %}
                <option value="{{ account.account_id }}" {% if event.account_id == account.account_id %}selected{% endif %}>
                    {{ account.bank_name }}
                </option>
                {% endfor %}
            </select>

            <button type="submit">Update</button>
        </form>
        <br>
        <a href="{{ url_for('home') }}">Back to Home</a>
    </div>
</body>
</html>
