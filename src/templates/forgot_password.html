<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WealthWatchers - Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='WealthWatchersStyle.css') }}">
</head>
<h2>Forgot Password</h2>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='WealthWatchersStyle.css') }}">
<form method="POST">
    Email: <input type="email" name="email" required><br><br>
    <button type="submit">Send Reset Link</button>
</form>
{% with messages = get_flashed_messages() %}
  {% for message in messages %}
    <p>{{ message }}</p>
  {% endfor %}
{% endwith %}
