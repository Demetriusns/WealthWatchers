<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Events Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='WealthWatchersStyle.css') }}">
</head>
<body>
    <div class="header">
        <h1>All Financial Events</h1>
    </div>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('add_event') }}">Add Event</a>
    </nav>

    <div class="container">
        <h2>List of All Events</h2>
        <ul>
            {% for event in events %}
                <li>
                    ${{ event.amount }} - {{ event.description }} on {{ event.date }} ({{ event.account.name }})
                    <a href="{{ url_for('edit_event', event_id=event.id) }}">Edit</a>
                </li>
            {% else %}
                <li>No events recorded yet.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
