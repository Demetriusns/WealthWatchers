<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wealth Watchers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="{{ url_for('home') }}">Wealth Watchers</a>
        <div class="collapse navbar-collapse">
            {% if current_user.is_authenticated %}
                <ul class="navbar-nav ms-auto">
                    {#

                    <!-- <li class="nav-item"><a class="nav-link" href="{{ url_for('add_expense') }}">Add Expense</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('forecast') }}">Forecast</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li> -->
                #}
                    <a href="{{ url_for('home') }}">Home</a>
                    <a href="{{ url_for('savings_add') }}">Add Savings</a>
                    <a href="{{ url_for('savings_view') }}">Edit Savings</a>
                </ul>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
