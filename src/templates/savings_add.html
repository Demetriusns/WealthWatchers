<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Savings </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='WealthWatchersStyle.css') }}">
</head>
<body>
    <div class="container">
        <h2>Add Savings Entry</h2>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
        </nav>


        <div class="container">
            <form method="POST">
                <label for="amount">Amount:</label>
                <input type="number" name="amount" step="0.01" required>

                <label>Category:</label>
                <select name="category_id" required>
                <option value="" disabled selected>Select a category</option>
                    {% for cat in categories %}
                        <option value="{{ cat.category_id }}">{{ cat.category_name }}</option>
                    {% endfor %}
                </select>

                <label for="description">Description:</label>
                <input type="text" name="description">

                <label for ="date">Date:</label>
                <input type="date" name="date" required>

                <label>Account:</label>
                <select name="account_id" required>
                <option value="" disabled selected>Select an Account</option>
                {% for acct in accounts %}
                    <option value="{{ acct.account_id }}">{{ acct.bank_name }} {{acct.description}} - ${{ acct.balance }}</option>
                {% endfor %}
                </select>

            <button type="submit">Add Savings</button>
        </form>
    </div>
</body>
</html>
