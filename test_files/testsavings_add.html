<!DOCTYPE html>
<html>
<head>
    <title>Add Savings Entry</title>
      <link rel="stylesheet" href="{{ url_for('static', filename='WealthWatchersStyle.css') }}">
</head>
<body>
    <div class="container">
        <h2>Add Savings Entry</h2>

       <form method="POST">

            <label>Amount:</label>
            <input type="number" name="amount" step="0.01" required>

            <!-- Dropdown for Category Selection -->
            <label>Category:</label>
            <select name="category_id" required>
                <option value="" disabled selected>Select a category</option>
                {% for category in categories %}
                    <option value="{{ category.category_id }}">{{ category.category_name }}</option>
                {% endfor %}
            </select>

            <label>Description:</label>
            <textarea name="description"></textarea>

            <label>Date:</label>
            <input type="date" name="date" required>

            <!-- Dropdown for Account Selection -->
            <label>Account:</label>
            <select name="account_id" required>
                <option value="" disabled selected>Select an Account</option>
                {% for account in accounts %}
                    <option value="{{ account.account_id }}">{{ account.bank_name }} ({{ account.account_type }}) - ${{ account.balance }}</option>
                {% endfor %}
            </select>

            <button type="submit">Add Savings</button>
        </form>
    </div>
</body>
</html>
