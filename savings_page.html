<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Savings Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='WealthWatchersStyle.css') }}">
</head>
<body>
    <div class="header">
        <h1>All Savings</h1>
    </div>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('savings_add') }}">Add Savings</a>
    </nav>

    <div class="container">
        <h2>List of Savings Entries</h2>
        <ul>
            {% for saving in savings %}
                <li>
                    ${{ saving.amount }} - {{ saving.description }}
                    <a href="{{ url_for('savings_edit', savings_id=saving.savings_id) }}">Edit</a>
                </li>
            {% else %}
                <li>No savings recorded yet.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
